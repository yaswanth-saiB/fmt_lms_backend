# ============================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================
server:
  port: ${PORT:8080}
  forward-headers-strategy: native  # trust X-Forwarded-For from Nginx — real client IP in logs

spring:
  application:
    name: fmt-backend

  # ==========================================
  # DATABASE CONFIGURATION
  # ==========================================
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
#     Railway will inject these environment variables automatically
#    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
#    username: ${PGUSER}
#    password: ${PGPASSWORD}
#    driver-class-name: org.postgresql.Driver


  # ==========================================
  # JPA CONFIGURATION
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # true in production


# ============================================
# EMAIL CONFIGURATION - 5 MAILBOXES
# ============================================
email:
  otp:
    host: ${OTP_EMAIL_HOST}
    port: ${OTP_EMAIL_PORT}
    username: ${OTP_EMAIL_USERNAME}
    password: ${OTP_EMAIL_PASSWORD}
    from: ${OTP_EMAIL_FROM}

  info:
    host: ${INFO_EMAIL_HOST}
    port: ${INFO_EMAIL_PORT}
    username: ${INFO_EMAIL_USERNAME}
    password: ${INFO_EMAIL_PASSWORD}
    from: ${INFO_EMAIL_FROM}

  help:
    host: ${HELP_EMAIL_HOST}
    port: ${HELP_EMAIL_PORT}
    username: ${HELP_EMAIL_USERNAME}
    password: ${HELP_EMAIL_PASSWORD}
    from: ${HELP_EMAIL_FROM}

  archive:
    host: ${ARCHIVE_EMAIL_HOST}
    port: ${ARCHIVE_EMAIL_PORT}
    username: ${ARCHIVE_EMAIL_USERNAME}
    password: ${ARCHIVE_EMAIL_PASSWORD}
    from: ${ARCHIVE_EMAIL_FROM}

  admin:
    host: ${ADMIN_EMAIL_HOST}
    port: ${ADMIN_EMAIL_PORT}
    username: ${ADMIN_EMAIL_USERNAME}
    password: ${ADMIN_EMAIL_PASSWORD}
    from: ${ADMIN_EMAIL_FROM}

# ============================================
# TWILIO SMS CONFIGURATION
# ============================================
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}


# ============================================
# SMS CONFIGURATION
# ============================================
sms:
  max-length: 160
  enable-unicode: false
  country-code: IN

# ============================================
# SENDGRID CONFIGURATION
# ============================================
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  enabled: ${SENDGRID_ENABLED:true}
  admin-email: ${ADMIN_EMAIL:connect.firstmilliontrade@gmail.com}
  
  # Archive/BCC settings
  archive:
    enabled: ${SENDGRID_ARCHIVE_ENABLED:true}
    email: ${ARCHIVE_EMAIL:archive@firstmilliontrade.com}
    name: ${ARCHIVE_NAME:First Million Trade Archive}

  # Email senders configuration
  senders:
    otp:
      email: ${OTP_FROM_EMAIL:noreply-otp@firstmilliontrade.com}
      name: ${OTP_FROM_NAME:First Million Trade}
      bcc-archive: ${OTP_BCC_ARCHIVE:false}

    welcome:
      email: ${WELCOME_FROM_EMAIL:noreply-info@firstmilliontrade.com}
      name: ${WELCOME_FROM_NAME:First Million Trade}
      bcc-archive: ${WELCOME_BCC_ARCHIVE:true}

    promo:
      email: ${PROMO_FROM_EMAIL:noreply-info@firstmilliontrade.com}
      name: ${PROMO_FROM_NAME:First Million Trade}
      bcc-archive: ${PROMO_BCC_ARCHIVE:true}

    support:
      email: ${SUPPORT_FROM_EMAIL:help@firstmilliontrade.com}
      name: ${SUPPORT_FROM_NAME:First Million Trade Support}
      bcc-archive: ${SUPPORT_BCC_ARCHIVE:false}

    admin:
      email: ${ADMIN_FROM_EMAIL:admin@firstmilliontrade.com}
      name: ${ADMIN_FROM_NAME:First Million Trade Admin}
      bcc-archive: ${ADMIN_BCC_ARCHIVE:true}


# ============================================
# JWT CONFIGURATION
# ============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:21600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

# ============================================
# TOKEN CLEANUP SCHEDULER
# ============================================
scheduling:
  enabled: true

# ============================================
# OTP CONFIGURATION
# ============================================
otp:
  expiry-minutes: 5
  max-attempts: 3
  lockout-minutes: 10
  resend-cooldown-seconds: 60
  length: 6

# ============================================
# DEVICE MANAGEMENT
# ============================================
device:
  max-sessions-per-user: 1
  max-streaming-sessions: 1
  inactive-days: 30

# ============================================
# APPLICATION CONFIGURATION
# ============================================
app:
  base-url: ${APP_BASE_URL:https://api.firstmilliontrade.com}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  environment: ${APP_ENVIRONMENT:development}
  enable-bcc: true
  bcc-address: archive@firstmilliontrade.com

  # ==========================================
  # COOKIE CONFIGURATION
  # ==========================================
  cookie:
    # Set to true in production (HTTPS only). Use env var COOKIE_SECURE=true on AWS/Railway.
    secure: ${COOKIE_SECURE:false}
    # Leave blank for localhost. Set to .firstmilliontrade.com in prod so
    # both api.firstmilliontrade.com and firstmilliontrade.com share cookies.
    domain: ${COOKIE_DOMAIN:}


# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    # Add this to show authorize button
    persist-authorization: true
  packages-to-scan:
    - com.fmt.fmt_backend.controller  # ✅ CRITICAL - tell Swagger where to scan
  paths-to-match:
    - /api/**  # ✅ Only include API paths

# ============================================
# ZOOM CONFIGURATION (Server-to-Server OAuth)
# ============================================
zoom:
  account-id: ${ZOOM_ACCOUNT_ID}
  client-id: ${ZOOM_CLIENT_ID}
  client-secret: ${ZOOM_CLIENT_SECRET}
  webhook-secret: ${ZOOM_WEBHOOK_SECRET}  # from Zoom Marketplace → Event Subscriptions → Secret Token

# ============================================
# BUNNY.NET STREAM CONFIGURATION
# ============================================
bunny:
  library-id: ${BUNNY_LIBRARY_ID:635843}
  api-key: ${BUNNY_API_KEY}
  cdn-hostname: ${BUNNY_CDN_HOSTNAME}          # e.g. vz-xxxxxxxx.b-cdn.net
  token-key: ${BUNNY_TOKEN_KEY}                 # CDN Zone → Token Authentication
  # No webhook secret — Bunny sends no auth header. Validation uses library-id from payload.

# ============================================
# ADMIN SEED (first-time bootstrap)
# ============================================
seed:
  admin:
    email: ${ADMIN_SEED_EMAIL:admin@firstmilliontrade.com}
    password: ${ADMIN_SEED_PASSWORD:Admin@1234}
    first-name: ${ADMIN_SEED_FIRST_NAME:Admin}
    last-name: ${ADMIN_SEED_LAST_NAME:First Million Trade}

# ============================================
# ACTUATOR — only /actuator/health exposed
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ============================================
# LOGGING
# ============================================
logging:
  level:
    com.fmt.fmt_backend: DEBUG
    org.springframework.security: INFO
    org.springframework.mail: DEBUG
    # Suppress 404 NoResourceFoundException — these are bot scans, not real errors
    org.springframework.web.servlet.resource: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"