<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f0f2f5; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px;">
                <tr>
                    <td style="background-color: #ffffff; border-radius: 10px; padding: 40px 36px; border: 1px solid #e2e6ea;">

                        <h2 style="color: #1a2b3c; margin-top: 0; margin-bottom: 16px; font-size: 22px;">
                            Welcome to First Million Trade, <span th:text="${firstName}">John</span>!
                        </h2>
                        <p style="color: #555; line-height: 1.6; margin: 0 0 12px;">
                            Your account has been successfully created. We're excited to have you on board.
                        </p>
                        <p style="color: #555; line-height: 1.6; margin: 0 0 28px;">
                            You can now log in and start exploring our trading courses and live sessions.
                        </p>

                        <div style="margin: 0 0 28px;">
                            <a th:href="${dashboardUrl}"
                               style="background-color: #0066cc; color: #ffffff; padding: 13px 28px;
                                      text-decoration: none; border-radius: 6px; font-size: 15px;
                                      font-weight: bold; display: inline-block;">
                                Go to Dashboard
                            </a>
                        </div>

                        <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0;">

                        <p style="font-size: 12px; color: #999; margin: 0 0 6px;">
                            Need help? Email us at
                            <a href="mailto:help@firstmilliontrade.com" style="color: #0066cc; text-decoration: none;">help@firstmilliontrade.com</a>
                        </p>
                        <p style="font-size: 12px; color: #bbb; margin: 0;">
                            &copy; First Million Trade <span th:text="${year}">2026</span>
                        </p>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
