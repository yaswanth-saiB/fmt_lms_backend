<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f0f2f5; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px;">
                <tr>
                    <td style="background-color: #ffffff; border-radius: 10px; padding: 40px 36px; border: 1px solid #e2e6ea;">

                        <h2 style="color: #1a2b3c; margin-top: 0; margin-bottom: 8px; font-size: 22px;">First Million Trade</h2>
                        <p style="color: #555; margin: 0 0 16px;">Use the verification code below to continue:</p>

                        <div style="background-color: #f0f4ff; border-radius: 8px; padding: 24px; text-align: center; margin: 24px 0; border: 1px solid #dce8ff;">
                            <span style="font-size: 40px; font-weight: bold; letter-spacing: 10px; color: #0066cc;" th:text="${otp}">123456</span>
                        </div>

                        <p style="color: #555; margin: 0 0 8px;">
                            This code expires in <strong><span th:text="${expiryMinutes}">5</span> minutes</strong>. Do not share it with anyone.
                        </p>
                        <p style="font-size: 13px; color: #888; margin: 0 0 24px;">
                            If you did not request this code, you can safely ignore this email.
                        </p>

                        <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0;">

                        <p style="font-size: 12px; color: #999; margin: 0 0 6px;">
                            Having trouble? Email us at
                            <a href="mailto:help@firstmilliontrade.com" style="color: #0066cc; text-decoration: none;">help@firstmilliontrade.com</a>
                        </p>
                        <p style="font-size: 12px; color: #bbb; margin: 0;">
                            &copy; First Million Trade <span th:text="${year}">2026</span>
                        </p>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
